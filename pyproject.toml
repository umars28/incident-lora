[project]
name = "incident-lora"
version = "0.1.0"
description = "LoRA fine-tuning of a small open model for incident root-cause classification, measured against its base model and served with vLLM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "safetensors>=0.4",
]

[project.scripts]
ilora = "incident_lora.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
